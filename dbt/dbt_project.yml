name: ecommerce_dwh
version: "1.0.0"
config-version: 2
profile: ecommerce_dwh

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ecommerce_dwh:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  ecommerce_dwh:
    +schema: staging
    pl_holidays:
      +column_types:
        holiday_date: date
        holiday_name: text
        is_day_off: boolean
