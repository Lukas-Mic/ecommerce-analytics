version: 2

models:
  # ---------------- core: model gwiazdy ----------------
  - name: fct_orders
    description: >
      Fakt zamówień (1 wiersz = 1 zamówienie). Klient scalony do konta głównego,
      konta testowe wykluczone. net_revenue = wartość po rabatach (0 dla anulowanych),
      net_revenue_after_returns = po odjęciu zwrotów, gross_margin = po zwrotach i koszcie towaru.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: order_date
        description: Data zamówienia w czasie lokalnym (Europe/Warsaw).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: campaign_id
        description: Kampania z atrybucji last-click (NULL = ruch nieprzypisany).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_campaigns')
                field: campaign_id
      - name: customer_order_seq
        description: Numer kolejnego (nieanulowanego) zamówienia klienta.
      - name: is_first_order
        description: Pierwsze nieanulowane zamówienie klienta w danych.

  - name: fct_order_items
    description: Fakt pozycji zamówień (ziarno - produkt w zamówieniu).
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

  - name: fct_returns
    description: Fakt zwrotów z czasem od zamówienia do zwrotu.
    columns:
      - name: return_id
        data_tests: [unique, not_null]
      - name: days_to_return
        data_tests: [not_null]

  - name: dim_customers
    description: >
      Wymiar klienta (konta główne bez kont testowych). Dane osobowe zminimalizowane:
      zamiast e-maila jest email_hash, bez nazwiska.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['aktywny', 'uśpiony', 'utracony', 'bez zamówień']
      - name: is_new_in_period
        description: Klient zarejestrowany w okresie objętym danymi (pełna historia zakupów).

  - name: dim_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_campaigns
    columns:
      - name: campaign_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: Kalendarz z polskimi nazwami miesięcy/dni i świętami ustawowymi.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  # ---------------- marketing ----------------
  - name: fct_marketing_daily
    description: >
      Dzień x kampania: koszt, wyświetlenia, kliknięcia oraz zamówienia i przychód
      z atrybucji last-click. ROAS = przychód / koszt.
    data_tests:
      - unique_combination:
          arguments:
            columns: [date_day, campaign_id]
    columns:
      - name: is_spend_missing
        description: Kampania płatna bez danych o kosztach w danym dniu (luka w eksporcie).

  # ---------------- raporty ----------------
  - name: rpt_monthly_kpis
    description: Miesięczne KPI zarządcze (przychód, marża, AOV, CAC, MER, dynamika m/m i r/r).
    columns:
      - name: month_start
        data_tests: [unique, not_null]

  - name: rpt_cohort_retention
    description: Retencja kohort miesięcznych (klienci pozyskani w okresie danych).
    data_tests:
      - unique_combination:
          arguments:
            columns: [cohort_month, months_since_first_order]

  - name: rpt_customer_rfm
    description: Segmentacja RFM klientów z co najmniej jednym nieanulowanym zamówieniem.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: rfm_segment
        data_tests: [not_null]

  # ---------------- jakość danych ----------------
  - name: dq_data_quality_checks
    description: Wykryte problemy jakości danych w źródłach i sposób ich obsłużenia.
