name: dbt CI

# Przy każdej zmianie: świeży Postgres, wygenerowane dane, pełny dbt build z testami.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: warehouse
          POSTGRES_USER: dwh_admin
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dwh_admin -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: dwh_admin
      PGPASSWORD: ci-password
      PGDATABASE: warehouse
      POSTGRES_USER: dwh_admin
      POSTGRES_DB: warehouse
      BI_READER_PASSWORD: ci-bi
      METABASE_DB_PASSWORD: ci-mb
      DBT_HOST: localhost
      DBT_PORT: 5432
      DBT_USER: dwh_admin
      DBT_PASSWORD: ci-password
      DBT_DBNAME: warehouse
      DBT_PROFILES_DIR: dbt

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Instalacja zależności
        run: pip install -r tools/requirements.txt

      - name: Generowanie danych syntetycznych
        run: python generator/generate_data.py --out data/raw

      - name: Inicjalizacja hurtowni (schematy i role)
        run: bash warehouse/init/01_init.sh

      - name: Ładowanie danych do schematu raw
        run: |
          sudo mkdir -p /data
          sudo ln -s "$GITHUB_WORKSPACE/data/raw" /data/raw
          psql -v ON_ERROR_STOP=1 -f warehouse/load_raw.sql

      - name: dbt build (modele + testy)
        run: dbt build --project-dir dbt

      - name: Testy asystenta AI (walidator SQL + przebieg na hurtowni)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: warehouse
          DB_USER: bi_reader
          DB_PASSWORD: ci-bi
        run: |
          pip install -r assistant/requirements.txt > /tmp/pip.log 2>&1 \
            || { echo "::error title=pip install::$(tail -5 /tmp/pip.log | tr '\n' ' ')"; exit 1; }
          python -m unittest discover -s assistant/tests -v > /tmp/tests.log 2>&1 \
            || { cat /tmp/tests.log; echo "::error title=Testy asystenta::$(grep -E 'Error|FAIL|assert' /tmp/tests.log | tail -6 | tr '\n' ' ')"; exit 1; }
          cat /tmp/tests.log

      - name: Raport jakości danych
        if: success()
        run: |
          {
            echo "## Raport jakości danych"
            echo
            echo "| Tabela | Kontrola | Problemy | Odsetek |"
            echo "|---|---|---:|---:|"
            psql -At -c "select format('| %s | %s | %s | %s%% |', source_table, check_name, issue_count, round(issue_rate * 100, 2)) from marts.dq_data_quality_checks"
          } >> "$GITHUB_STEP_SUMMARY"
